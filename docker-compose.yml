services:

  db:
    image: mysql:8.0
    container_name: db
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: oto2_db
      MYSQL_USER: oto2_user
      MYSQL_PASSWORD: oto2_pass
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    image: node:20
    container_name: backend
    working_dir: /app
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: oto2_db
      DB_USERNAME: oto2_user
      DB_PASSWORD: oto2_pass
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
    command: sh -c "npm ci || npm install; node server.js"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20
    container_name: frontend
    working_dir: /app
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm ci || npm install; npm run dev"
    depends_on:
      - backend

volumes:
  mysql_data:
